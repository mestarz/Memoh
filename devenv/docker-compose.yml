name: "memoh-dev"

# Development infrastructure for Memoh.
#
# The Memoh server runs as a local process on the host (use `mise run dev` or
# `go run ./cmd/agent serve` after `mise run db-up`). This stack only provides
# the supporting services on alternate ports so dev does not collide with a
# production deployment on the same machine.

services:
  postgres:
    image: postgres:18-alpine
    container_name: memoh-dev-postgres
    environment:
      POSTGRES_DB: memoh
      POSTGRES_USER: memoh
      POSTGRES_PASSWORD: memoh123
    volumes:
      - postgres_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${MEMOH_DEV_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoh"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memoh-dev-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${MEMOH_DEV_QDRANT_HTTP_PORT:-16333}:6333"
      - "${MEMOH_DEV_QDRANT_GRPC_PORT:-16334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sparse:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sparse
    container_name: memoh-dev-sparse
    ports:
      - "${MEMOH_DEV_SPARSE_PORT:-18085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

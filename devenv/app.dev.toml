# Memoh development configuration.
# Connects to devenv/docker-compose.yml infrastructure (PostgreSQL, Qdrant, sparse).
# The server itself runs as a local process on the host.

[log]
level = "debug"
format = "text"

[server]
addr = "127.0.0.1:18080"

[admin]
username = "admin"
password = "admin123"
email = "dev@memoh.local"

[auth]
jwt_secret = "memoh-dev-secret-do-not-use-in-production"
jwt_expires_in = "168h"

timezone = "UTC"

[database]
driver = "postgres"

[container]
backend = "docker"
default_image = "debian:bookworm-slim"
image_pull_policy = "if_not_present"
data_root = "data/dev"
runtime_dir = "data/dev/runtime"

[docker]
host = ""

[postgres]
host = "127.0.0.1"
port = 15432
user = "memoh"
password = "memoh123"
database = "memoh"
sslmode = "disable"

[qdrant]
base_url = "http://127.0.0.1:16334"
api_key = ""
timeout_seconds = 10

[sparse]
base_url = "http://127.0.0.1:18085"

[registry]
providers_dir = "conf/providers"

[web]
host = "127.0.0.1"
port = 18082

# Memoh configuration template.
# Copy to config.toml and adjust values for your environment.
# For local development, use: cp devenv/app.dev.toml config.toml

[log]
level = "info"
format = "text"

[server]
addr = "127.0.0.1:18731"

[admin]
username = "admin"
password = "admin123"
email = "admin@memoh.local"

[auth]
jwt_secret = "CHANGE-ME-TO-A-RANDOM-SECRET"
jwt_expires_in = "168h"

timezone = "UTC"

[database]
# Only PostgreSQL is supported.
driver = "postgres"

[container]
# Only "docker" is supported. Bot workspaces run as Docker containers managed
# through the host Docker daemon.
backend = "docker"
# registry = "memoh.cn"  # Uncomment for China mainland mirror
default_image = "debian:bookworm-slim"
# Workspace image pull policy: if_not_present, always, or never.
image_pull_policy = "if_not_present"
# Host data root for workspace metadata, sockets, and overlay sidecars.
data_root = "data"
# Host directory containing the prebuilt workspace runtime (bridge binary,
# templates, toolkit) that is bind-mounted into each workspace container.
# Run `mise run install-workspace-toolkit` and `mise run bridge:build` to
# populate it.
runtime_dir = "data/runtime"

[docker]
# Leave empty to use Docker's standard environment discovery (DOCKER_HOST,
# DOCKER_TLS_VERIFY, DOCKER_CERT_PATH, or the platform default socket).
host = ""

[postgres]
host = "127.0.0.1"
port = 5432
user = "memoh"
password = "memoh123"
database = "memoh"
sslmode = "disable"

[qdrant]
base_url = "http://127.0.0.1:6334"
api_key = ""
timeout_seconds = 10

[sparse]
base_url = "http://127.0.0.1:8085"

[registry]
providers_dir = "conf/providers"
# Set to true to prevent models from being automatically added/updated on startup.
# disable_model_sync = false

[supermarket]
base_url = "https://supermarket.memoh.ai"

[web]
host = "127.0.0.1"
port = 8082

## Bot workspace remote desktop (WebRTC) tuning.
##
## When the server is reached from another host on the LAN, browsers must be
## able to receive a host candidate that points to a reachable IP. By default
## Memoh auto-discovers every non-loopback interface IP and advertises them
## as host candidates (enough for most LAN deployments).
##
## For NAT'd / firewalled environments, fix the UDP port range so it can be
## opened in the firewall, and optionally enable an ICE-TCP fallback for
## clients that cannot send UDP at all.
[display.webrtc]
# udp_port_min = 50000
# udp_port_max = 50100
# tcp_port = 50443             # 0 disables ICE-TCP; set to enable.
# nat_ips = ["203.0.113.10"]   # Extra public/LAN IPs to advertise.
# auto_nat_ips = true          # Default true; false to advertise only nat_ips.
# auto_nat_include_cidrs = [   # Restrict auto-discovered IPs to these CIDRs.
#   "192.168.0.0/16",          #   LAN
#   "10.0.0.0/8",              #   private + VPN
#   "100.64.0.0/10",           #   Tailscale CGNAT v4
#   "fd7a:115c::/32",          #   Tailscale ULA v6
# ]                            # Useful to skip docker bridges (172.16/12).
# stun_servers = ["stun:stun.l.google.com:19302"]

experimental_monorepo_root = true

[monorepo]
config_roots = ["apps/web", "cmd/agent"]

[tools]
go = "1.25.6"
node = "25"
pnpm = "10"
sqlc = "latest"
"golangci-lint" = "2.10.1"

[task_config]
dir = "{{cwd}}"

[settings]
experimental = true

[tasks.pnpm-install]
description = "Install dependencies"
env = { CI = "true" }
run = "pnpm install"

[tasks.go-install]
description = "Install Go dependencies"
run = "go mod download"

[tasks.swagger-generate]
description = "Generate Swagger documentation"
depends = ["//:go-install"]
run = "cd internal/handlers && go generate"

[tasks.sdk-generate]
description = "Generate SDK code"
depends = ["//:pnpm-install", "//:swagger-generate"]
run = "pnpm run generate-sdk"

[tasks.sqlc-generate]
description = "Generate SQL code"
run = "sqlc generate"

[tasks.icons-generate]
description = "Generate icon Vue components from SVG sources"
run = "pnpm --filter @memohai/icon generate"

# ---------------------------------------------------------------------------
# Development infrastructure (Docker Compose) — server runs locally on host.
# ---------------------------------------------------------------------------

[tasks."infra:up"]
description = "Start dev infrastructure (postgres + qdrant + sparse) in background"
run = "docker compose -f devenv/docker-compose.yml up -d"

[tasks."infra:down"]
description = "Stop dev infrastructure"
run = "docker compose -f devenv/docker-compose.yml down --remove-orphans"

[tasks."infra:logs"]
description = "Tail dev infrastructure logs"
run = "docker compose -f devenv/docker-compose.yml logs -f"

[tasks."infra:restart"]
description = "Restart a dev infrastructure service (usage: mise run infra:restart -- postgres)"
run = "docker compose -f devenv/docker-compose.yml restart $@"

[tasks.dev]
description = "Start dev: bring up infrastructure, migrate DB, run server with air"
run = """
#!/bin/bash
set -e
docker compose -f devenv/docker-compose.yml up -d
CONFIG_PATH=devenv/app.dev.toml go run ./cmd/agent migrate up
CONFIG_PATH=devenv/app.dev.toml exec air -c .air.toml
"""

[tasks.serve]
description = "Run server once (no reload) using dev config"
run = "CONFIG_PATH=devenv/app.dev.toml go run ./cmd/agent serve"

[tasks.web]
description = "Run the web frontend dev server"
env = { MEMOH_WEB_PROXY_TARGET = "http://127.0.0.1:18080" }
run = "pnpm --filter @memohai/web dev"

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

[tasks.db-up]
description = "Initialize and migrate the database"
run = "scripts/db-up.sh"

[tasks.db-down]
description = "Drop the database"
run = "scripts/db-drop.sh"

# ---------------------------------------------------------------------------
# Workspace runtime (bridge + toolkit) — bind-mounted into bot containers.
# ---------------------------------------------------------------------------

[tasks."bridge:build"]
description = "Build the workspace bridge binary into data/runtime/bridge"
run = """
#!/bin/bash
set -e
mkdir -p data/runtime
go build -o data/runtime/bridge ./cmd/bridge
cp -a cmd/bridge/template data/runtime/templates
echo '✓ bridge + templates ready in data/runtime/'
"""

[tasks.install-workspace-toolkit]
description = "Download node/uv/xvnc into data/runtime/toolkit (bind-mounted into workspaces)"
run = "./docker/toolkit/install.sh data/runtime/toolkit"

# ---------------------------------------------------------------------------
# Build / release
# ---------------------------------------------------------------------------

[tasks.build-embedded-assets]
description = "Build and stage embedded web assets"
depends = ["//:pnpm-install"]
run = "scripts/release.sh --prepare-assets"

[tasks.build-unified]
description = "Build memoh CLI locally"
depends = ["//:build-embedded-assets"]
run = "go build -o bin/memoh ./cmd/memoh"

[tasks.release]
description = "Release new version"
run = "pnpm release"

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------

[tasks.lint]
description = "Run all linters"
depends = ["//:lint:go", "//:lint:es"]

[tasks."lint:fix"]
description = "Run all linters with auto-fix"
depends = ["//:lint:go:fix", "//:lint:es:fix"]

[tasks."lint:go"]
description = "Run Go linter"
run = "golangci-lint run ./..."

[tasks."lint:go:fix"]
description = "Run Go linter with auto-fix"
run = "golangci-lint run --fix ./..."

[tasks."lint:es"]
description = "Run ESLint"
run = "pnpm lint"

[tasks."lint:es:fix"]
description = "Run ESLint with auto-fix"
run = "pnpm lint:fix"

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Setup development environment"
depends = [
  "//:install-workspace-toolkit",
  "//:bridge:build",
  "//:sqlc-generate",
  "//:pnpm-install",
  "//:go-install",
]
run = """
#!/bin/bash
set -e
echo '✓ Setup complete!'
echo '  Next: mise run dev   (starts postgres+qdrant+sparse and runs server with air)'
echo '  Then: mise run web   (in another terminal — opens http://localhost:18082)'
"""

name: "memoh"

# Memoh infrastructure stack (production / single-host).
#
# The Memoh server now runs as a *local process* on the host (see `memoh start`
# from `cmd/memoh`). This compose file only provisions the supporting
# infrastructure: PostgreSQL, Qdrant, the sparse encoder, and the headless
# browser worker. Bot workspace containers are managed directly by the local
# server through the host Docker socket.
#
# All services bind to 127.0.0.1 only so they are not exposed publicly.

services:
  postgres:
    image: postgres:18-alpine
    container_name: memoh-postgres
    environment:
      POSTGRES_DB: memoh
      POSTGRES_USER: memoh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memoh123}
    volumes:
      - postgres_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - memoh-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memoh-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - memoh-network

  sparse:
    image: memohai/sparse:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.sparse
    container_name: memoh-sparse
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - memoh-network

  browser:
    image: memohai/browser:latest
    container_name: memoh-browser
    environment:
      BROWSER_CORES: ${BROWSER_CORES:-chromium,firefox}
      http_proxy: "${CONTAINER_HTTP_PROXY:-}"
      https_proxy: "${CONTAINER_HTTP_PROXY:-}"
      HTTP_PROXY: "${CONTAINER_HTTP_PROXY:-}"
      HTTPS_PROXY: "${CONTAINER_HTTP_PROXY:-}"
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - memoh-network

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  memoh-network:
    driver: bridge
